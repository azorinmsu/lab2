services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: accounts
    ports:
      - "15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d accounts"]
      interval: 2s
      timeout: 5s
      retries: 20

  account-service:
    build:
      context: .
      dockerfile: src/AccountService/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ConnectionStrings__Accounts: Host=postgres;Port=5432;Database=accounts;Username=postgres;Password=postgres
